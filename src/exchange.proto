syntax = "proto3";

package exchange;

// ---- messages (replace your NewOrderMsg struct) ----
message NewOrderRequest {
  uint32 side = 1;         // 0 = buy, 1 = sell
  uint32 order_type = 2;   // maps to your Type enum
  uint64 price = 3;
  uint64 size = 4;
  uint64 reserve = 5;
  uint64 display_size = 6;
}

message OrderResponse {
  uint64 assigned_id = 1;  // server-assigned id
  bool accepted = 2;
  uint64 filled_size = 3;
  uint32 reason = 4;
}

message NewCancelRequest {
  uint64 id = 1;
}

message CancelResponse {
  uint32 reason = 1;
}

message NewModifyOrder {
  uint64 id = 1;
  optional uint64 price = 2;
  optional uint64 size = 3;
}

message ModifyResponse {
  uint32 reason = 1;
  bool accepted = 2;
  uint64 id = 3;
}

enum Side {
  SIDE_BUY = 0;
  SIDE_SELL = 1;
}

message EventAdd {
  Side side = 1;
  uint64 price = 2;
  uint64 timestamp = 3;
  uint64 id = 4;
  uint64 size = 5;
}

message EventCancel {
  uint64 price = 1;
  uint64 id = 2;
}

message EventModifyPrice {
  uint64 price = 1;
  uint64 new_price = 2;
  uint64 id = 3;
}

message EventModifySize {
  uint64 size = 1;
  uint64 new_size = 2;
  uint64 price = 3;
  uint64 id = 4;
}

message EventTrade {
  uint64 trade_price = 1;
  uint64 trade_size = 2;
  uint64 resting_id = 3;
  uint64 incoming_id = 4;
}

message MarketDataEvent {
  uint64 seq = 1;
  bool snapshot = 7;
  oneof event {
    EventAdd add = 2;
    EventCancel cancel = 3;
    EventModifyPrice modify_price = 4;
    EventModifySize modify_size = 5;
    EventTrade trade = 6;
  }
}

message SubscribeRequest {
  enum Depth {
    DEPTH_L3 = 0;
    DEPTH_L2 = 1;
  }
  Depth depth = 1;
}

// ---- the service (replace your socket code) ----
service Exchange {
  rpc SubmitOrder(NewOrderRequest) returns (OrderResponse);
  rpc SubmitCancel(NewCancelRequest) returns (CancelResponse);
  rpc SubmitModify(NewModifyOrder) returns (ModifyResponse);
  rpc Subscribe(SubscribeRequest) returns (stream MarketDataEvent);
}
