services:
  mysql:
    image: mysql:8.0
    container_name: exchange-db
    environment:
      MYSQL_ROOT_PASSWORD: devpassword
      MYSQL_DATABASE: exchange
      MYSQL_USER: exchange
      MYSQL_PASSWORD: devpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d

volumes:
  mysql-data:
